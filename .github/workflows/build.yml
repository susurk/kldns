name: Build KLDNS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 设置 Node.js 环境（用于构建前端）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json' # 指定前端依赖锁文件路径

      # 2. 安装前端依赖
      - name: Install frontend dependencies
        run: cd web && npm ci

      # 3. 构建前端，生成 web/dist 目录
      - name: Build frontend
        run: cd web && npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 4. 编译 Go 后端（此时 web/dist 已存在，embed 指令就能找到文件了）
      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" -o kldns ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kldns-linux-amd64
          path: kldns
